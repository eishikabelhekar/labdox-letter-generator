name = "labdox-letter-generator"
main = "src/index.js"
compatibility_date = "2026-04-21"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Run `wrangler d1 create labdox-letter-generator` once, then paste the
# database_id it prints below. See README.md "Deploying to Cloudflare".
[[d1_databases]]
binding = "DB"
database_name = "labdox-letter-generator"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "labdox-letter-files"

# Server-side PDF rendering. For Wrangler local testing, add remote = true under [browser].
[browser]
binding = "BROWSER"

[vars]
APP_NAME = "Labdox Letter Generator"
SESSION_TTL_HOURS = "12"

# Provision INITIAL_ADMIN_EMAIL and INITIAL_ADMIN_PASSWORD with wrangler secret put.
# Remove INITIAL_ADMIN_PASSWORD after the administrator changes it.
[triggers]
crons = ["17 2 * * *"]
