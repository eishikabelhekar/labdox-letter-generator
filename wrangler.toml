name = "labdox-letter-generator"
main = "src/index.js"
compatibility_date = "2026-04-21"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Dedicated D1 database for the no-card pilot.
[[d1_databases]]
binding = "DB"
database_name = "labdox-letter-generator"
database_id = "6a5b8bd7-37ba-4ac3-bd77-fb3c2b751ec5"
migrations_dir = "migrations"

# No R2 binding in the no-card pilot. PDFs and images use D1 file_objects.

[browser]
binding = "BROWSER"

[vars]
APP_NAME = "Labdox Letter Generator"
SESSION_TTL_HOURS = "12"

[triggers]
crons = ["17 2 * * *"]
